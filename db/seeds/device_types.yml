- name: デスクトップパソコン
  icon: <i class="fas fa-computer"></i>
  description: |
    机上で固定して使用するパソコンです。

- name: ノートパソコン
  icon: <i class="fas fa-laptop"></i>
  description: |
    ノートのような形状の持ち運びできるパソコンです。
    パソコン本体に液晶画面とキーボードがついています。
    キーボード部分を除いた本体・画面部分単体で発売されている機種はタブレットを選択してください。

- name: タブレット
  icon: <i class="fas fa-tablet"></i>
  description: |
    iPad、Surface、Androidタブレット等です。
    ドッキング可能な専用キーボードが必ず付属する機種は
    ノートパソコンを選択してください。

- name: 携帯電話
  icon: <i class="fas fa-mobile"></i>
  description: |
    iPhoneやAndroid等のスマーフォンやフィーチャーフォンです。

- name: ウェアラブル
  icon: <i class="fas fa-clock"></i>
  description: |
    スマートウォッチ(Apple Watch等)、スマートグラス、スマートリング等のネットワーク接続機能が付いた着用可能な機器です。

- name: 携帯情報端末
  icon: <i class="fas fa-wifi"></i>
  description: |
    PDAやメディアプレーヤー等の小型情報端末です。

- name: 周辺機器
  icon: <i class="fas fa-print"></i>
  description: |
    プリンター、スキャナー、FAX、複合機などの周辺機器です。

- name: 映像音声機器
  icon: <i class="fas fa-video"></i>
  description: |
    ネットワークに接続して映像や音声をやり取りできる機器です。
    ネットワークカメラ、レコーダー、電子看板(デジタルサイネージ)、プロジェクター、ビデオ会議システム、IP電話等です。

- name: スマート家電
  icon: <i class="fas fa-tv"></i>
  description: |
    スマートテレビ等のネットワーク接続可能な家電製品です。

- name: サーバー
  icon: <i class="fas fa-server"></i>
  description: |
    サーバーです。
    物理的に存在し、ラックマウント型、タワー型、ブレード型等があります。

- name: NAS
  icon: <i class="fas fa-hdd"></i>
  description: |
    NAS(ネットワークアタッチトストレージ)はネットワークを経由したストレージです。
    SMB/CIFS、NFS、AFP等のファイル共有を専用に扱うサーバーです。
    FC、SCSI、iSCSI等でストレージ自体を提供する場合も含みます。

- name: ネットワーク機器
  icon: <i class="fas fa-network-wired"></i>
  description: |
    スイッチングハブ、ルーター、無線LANアクセスポイント、ファイアウォール、VPN装置、ロードバランサー、UTM等のネットワーク機器です。

- name: 仮想マシン
  icon: <i class="fas fa-cloud"></i>
  description: |
    仮想ホスト上の仮想マシンです。

- name: その他
  icon: <i class="fas fa-ethernet"></i>
  description: |
    いずれにも該当しない場合は、こちらを選択してください。
